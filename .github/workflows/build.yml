name: MSBuild

on:
  push:
    branches:
      - master
      - modern-ui
  workflow_dispatch:

env:
  SOLUTION_FILE_PATH: CP_Main_10.sln

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        working-directory: ${{env.GITHUB_WORKSPACE}}
        run: nuget restore ${{env.SOLUTION_FILE_PATH}}

      - name: Build 64bit
        shell: pwsh
        run: |
          msbuild CP_Main_10.sln /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Retrying build with PlatformToolset=v143..."
            msbuild CP_Main_10.sln /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143
          }

      - name: Build Portable ZIP
        run: |
          DittoSetup\BuildPortableZIP.bat "DittoPortable_Modern_x64" bit64

      - name: Upload Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DittoPortable_Modern_x64
          retention-days: 30
          path: |
            DittoSetup\Output\DittoPortable_Modern_x64.zip
            Release64\Ditto.exe
            Release64\ICU_Loader.dll
            Release64\Addins\DittoUtil.dll

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: modern-ui-latest
          name: "Ditto Modern UI Build"
          body: "Modern UI overhaul with Windows 11 rounded corners, floating cards, keycap badges, focus ring search bar, and Fluent themes."
          prerelease: false
          files: |
            DittoSetup\Output\DittoPortable_Modern_x64.zip
            Release64\Ditto.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
